[package]
name = "spirula"
description = "Rust command line for the in-progress port of Spirula Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "spirula"
path = "src/main.rs"

[dependencies]
spirula-core = { path = "../spirula-core" }
spirula-data = { path = "../spirula-data" }
spirula-backend = { path = "../spirula-backend" }
spirula-engine = { path = "../spirula-engine" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
